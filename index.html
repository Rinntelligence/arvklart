<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arvklart — Arvefordeling gjort enklere</title>
    <meta name="description" content="Arvklart hjelper familier med å fordele arv på en ryddig, inkluderende og rettferdig måte." />
    <link rel="icon" type="image/svg+xml" href="/Arvklart Favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; }
      body { background: #FBF9F5; font-family: 'Karla', sans-serif; color: #3A2F26; -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-thumb { background: #D9CFC0; border-radius: 3px; }
      /* iOS zoomer inn på felt med skrift under 16px */
      @media (max-width: 600px) { input, select, textarea { font-size: 16px !important; } }
      /* Synlig tastaturfokus overalt (WCAG 2.4.7). Mørk sage gir 5,2:1 mot snow; mørke flater setter sin egen farge */
      :focus-visible { outline: 3px solid #5F6E52; outline-offset: 2px; }
      /* Tekst utenfor skjermen, for skjermlesere */
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
