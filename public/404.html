<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Fant ikke siden — Arvklart</title>
  <link rel="icon" type="image/svg+xml" href="/Arvklart Favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Karla:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Ukjente adresser (og guider som ikke er publisert) gir HTTP 404 med denne siden fra Vercel. Ingen skript:
       siden virker uten appen. Se vercel.json og test/e2e/seo.mjs. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #FBF9F5; color: #3A2F26; font-family: 'Karla', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #2A211A; padding: 20px 24px; }
    header img { height: 26px; display: block; }
    main { flex: 1; max-width: 640px; margin: 0 auto; padding: 72px 24px; width: 100%; }
    h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 2rem; line-height: 1.25; margin-bottom: 14px; }
    p { color: #5C4530; line-height: 1.65; margin-bottom: 24px; }
    ul { list-style: none; display: flex; flex-wrap: wrap; gap: 12px; }
    a.btn { display: inline-block; padding: 12px 20px; border-radius: 8px; background: #3A2F26; color: #FBF9F5; text-decoration: none; font-weight: 500; }
    a.btn.alt { background: #E8DFD0; color: #3A2F26; }
    a:focus-visible { outline: 3px solid #5F6E52; outline-offset: 2px; }
    .en { margin-top: 40px; font-size: 0.875rem; color: #75604B; }
    .en a { color: #5F6E52; }
  </style>
</head>
<body>
  <header><a href="/"><img src="/ARVKLART Horizontal Negative.svg" alt="Arvklart" /></a></header>
  <main>
    <h1>Fant ikke siden</h1>
    <p>Adressen finnes ikke, eller siden er flyttet. Sjekk at adressen er riktig, eller gå videre herfra.</p>
    <ul>
      <li><a class="btn" href="/">Til forsiden</a></li>
      <li><a class="btn alt" href="/app">Mine bo</a></li>
      <li><a class="btn alt" href="/veiviser">Veiviser</a></li>
    </ul>
    <p class="en" lang="en">Page not found. <a href="/">Go to the home page</a> or <a href="/app">to your estates</a>.</p>
  </main>
</body>
</html>
